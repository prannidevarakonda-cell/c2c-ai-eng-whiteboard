<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=0.5">
  <title>Whiteboard</title>
  <link rel="stylesheet" href="style.css">
  <script src="drawing.js" defer></script>
  <style>
    .toolbar-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      grid-template-rows: repeat(4, 48px);
      gap: 4px;
      max-width: 200px;
      width: 100%;
      justify-items: stretch;
    }

    .toolbar-grid button {
      width: 100%;
      height: 100%;
      box-sizing: border-box;
      display: block;
    }

    header {
      display: grid;
      grid-template-columns: 1fr;
    }

    header h1 {
      border: 2px solid #000000;
      padding: 8px;
      margin: 0;
      font-weight: bold;
      

      text-align: center;
      color: #ffffff;
      -webkit-text-stroke: 2px #000000;
      text-shadow: 2px 2px 0 #000000;
    }
  </style>
</head>
<body>
  <header>
    <h1>Whiteboard</h1>
    <div class="toolbar-grid" aria-label="Whiteboard tools">
        <button id="clear-button" type="button" class="tool-button">Clear</button>
        <button id="eraser-button" type="button" class="tool-button"
        aria-pressed="false">Eraser</button>
        <button id="undo-button" type="button" class="tool-button">Undo</button>
        <button id="redo-button" type="button" class="tool-button">Redo</button>
        <button id="save-button" type="button" class="tool-button">Save</button>
        <button id="load-button" type="button" class="tool-button">Load Drawing</button>
        <button id="Ruler-button" type="button" class="tool-button"
        aria-label="Toggle ruler" aria-pressed="false">📏</button>
        <button id="palette-toggle" type="button" aria-label="Open color palette"
        aria-expanded="false">🖌️</button>
    </div>
    <input id="drawing-file" type="file" accept="image/png" hidden>
    <div class="marker-size-control">
      <label for="marker-size">Marker Size:</label>
      <input id="marker-size" type="range" min="2" max="16" step="1" value="4">
    </div>
    <output id="drawing-status" aria-live="polite"></output>
  </header>
<div id="color-picker" class="hidden">
  <button class="color" type="button" data-color="#000000" aria-label="Black"
  aria-pressed="true" style="background:#000000"></button>
  <button class="color" type="button" data-color="#ff0000" aria-label="Red"
  aria-pressed="false" style="background:#ff0000"></button>
  <button class="color" type="button" data-color="#00ff00" aria-label="Green"
  aria-pressed="false" style="background:#00ff00"></button>
  <button class="color" type="button" data-color="#0000ff" aria-label="Blue"
  aria-pressed="false" style="background:#0000ff"></button>
  <button class="color" type="button" data-color="#ff9900" aria-label="Orange"
  aria-pressed="false" style="background:#ff9900"></button>
  <button class="color" type="button" data-color="#ffffff" aria-label="White"
  aria-pressed="false" style="background:#ffffff"></button>
  <button class="color" type="button" data-color="#800080" aria-label="Purple"
  aria-pressed="false" style="background:#800080"></button>
  <button id="close-picker" type="button">Close</button>
</div>
  <main>
    <canvas id="whiteboard" aria-label="Drawing canvas"></canvas>
  <canvas id="ruler-preview" aria-hidden="true"></canvas>
</main>
</body>
</html>
